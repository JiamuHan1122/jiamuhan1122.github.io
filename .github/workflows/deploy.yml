name: Deploy site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal site repository
        uses: actions/checkout@v4

      - name: Checkout official al-folio source
        uses: actions/checkout@v4
        with:
          repository: alshedivat/al-folio
          ref: 8158dd07b40eda745da47a55a8a711332286dbf5
          path: upstream

      - name: Preserve personal configuration and overlay it on official al-folio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/al-folio-overrides
          tar -cf /tmp/al-folio-overrides/site.tar \
            _config.yml \
            _pages/about.md _pages/research.md _pages/projects.md _pages/publications.md _pages/cv.md \
            _bibliography/papers.bib \
            _data/socials.yml _data/cv.yml \
            _projects/temporal-action-detection.md \
            _projects/action-recognition.md \
            _projects/3d-human-interaction-understanding.md \
            _projects/missing-modality-multimodal-sentiment.md \
            _projects/undergraduate-thesis.md \
            assets/img/prof_pic.png

          # Copy upstream files without deleting the source directory.
          # The upstream checkout lives inside the workspace, so rsync --delete
          # must not be used with the workspace as its destination.
          tar -C upstream \
            --exclude='.git' \
            --exclude='.github/workflows/deploy.yml' \
            -cf - . | tar -C . -xf -

          # Restore the personal files over the official theme defaults.
          tar -xf /tmp/al-folio-overrides/site.tar -C .
          rm -rf upstream

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.13"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install image tools and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip install --upgrade nbconvert

      - name: Build Jekyll site
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Mark generated site as prebuilt static content
        run: touch _site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
